name: NUMERA foundation checks
on:
  push:
    branches: [numera/development]
  pull_request:
    branches: [numera/development]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check numera/static/workspace.js
      - run: node --check numera/static/purchases.js
      - run: node --check numera/static/sales.js
      - run: node --check numera/static/payments.js

name: NEXUS ERP safety checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/safety-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/safety-checks.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate backend, frontend, and migration syntax
        run: |
          python -m py_compile app/main.py migrations/versions/*.py
          node --check app/static/app.js
      - name: Run safety workflow tests
        run: python -m unittest discover -s tests -v
